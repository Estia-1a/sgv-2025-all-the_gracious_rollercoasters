<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cours en ligne – Plateforme Bidart</title>
    <link rel="stylesheet" href="style-cours.css">
</head>

<body>
<div class="page">

    
    <div class="topbar">
        Vous êtes ici :
        <a href="#">Accueil</a>
        <span> &gt; Cours en ligne</span>
    </div>

        <header class="hero">
        <div class="hero-inner">
            <div class="hero-title">
                <h1>Suivre mes cours<br> en ligne</h1>
            </div>

            <div class="hero-search">
                <form class="hero-search-form">
                    <input
                        type="search"
                        class="hero-search-input"
                        placeholder="Rechercher un cours (C, méca, élec, automatisme...)">
                    <button type="submit" class="hero-search-button" aria-label="Rechercher">
                        &#128269;
                    </button>
                </form>
            </div>
        </div>
    </header>
    <main class="main">
        <div class="main-layout">
            <aside class="filters" aria-label="Filtres des cours">
                <h2>Filtrer les cours</h2>

                <!-- Groupe : statut du cours -->
                <div class="filter-group">
                    <div class="filter-group-title">Statut du cours</div>

                    <label class="filter-option">
                        <input type="checkbox" name="statut-en-cours">
                        <span>En cours</span>
                        <span class="filter-count"></span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="statut-non-debute">
                        <span>Non débuté</span>
                        <span class="filter-count"></span>
                    </label>

                    <label class="filter-option">
                        <input type="checkbox" name="statut-termine">
                        <span>Terminé</span>
                        <span class="filter-count"></span>
                    </label>
                </div>
                 <div class="filter-group">
     <div class="filter-title">Matière</div>
    <label class="filter-option">
      <input type="checkbox" name="matiere" value="maths">
      Mathématiques 
    </label>
    <label class="filter-option">
      <input type="checkbox" name="matiere" value="physique">
      Physique 
    </label>
    <label class="filter-option">
      <input type="checkbox" name="matiere" value="informatique">
      Informatique 
    </label>
  </div>
