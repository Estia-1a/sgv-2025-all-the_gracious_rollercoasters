<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/desktop.css" media="screen and (min-width: 768px)"> 
    <link rel="stylesheet" href="styles/mobile.css" media="screen and (max-width: 767px)"> 
    <title>Document</title>
</head>
<body>
    

<section id="mes-cours" aria-labelledby="mes-cours-titre">
            <h3 id="mes-cours-titre">Mes cours inscrits</h3>

        
            <form aria-label="Filtres de mes cours">
                <label for="recherche-cours">Rechercher un cours :</label>
                <input type="search" id="recherche-cours" name="recherche-cours" placeholder="Nom du cours...">

                <label for="filtre-statut">Filtrer par statut :</label>
                <select id="filtre-statut" name="filtre-statut">
                    <option value="tous">Tous</option>
                    <option value="en-cours">En cours</option>
                    <option value="termine">Terminé</option>
                    <option value="non-commence">Non commencé</option>
                </select>

                <button type="submit">Appliquer</button>
            </form>
